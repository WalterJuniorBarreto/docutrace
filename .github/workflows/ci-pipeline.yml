name: DocuTrace Core CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Escaneo de Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  backend-build:
    name: Build & Test Backend
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docutrace-backend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Verificar formato y análisis estático
        run: ./mvnw checkstyle:check
      - name: Ejecutar pruebas (Unitarias y Arquitectura)
        run: ./mvnw test
      - name: Validar empaquetado
        run: ./mvnw package -DskipTests

  frontend-build:
    name: Build Frontend
    needs: security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docutrace-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./docutrace-frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilación estricta
        run: npm run build --configuration=production
